window.onload = IniButtons;

function IniButtons()
{
	SpelerTotaal = 0;
	PcTotaal = 0;
	SpelerGestopt = false;
	PcGestopt = false;
	document.getElementById("verder").onclick = SpelerSpeelt;
	document.getElementById("stop").onclick = SpelerStopt;
	document.getElementById("verder").value = "get a new card";
	document.getElementById("stop").value = "pass";
	document.getElementById("nieuw").onclick= IniButtons;
}

function BepaalWaardeKaart()
{
	var getal = Math.round(Math.random()*100);
	if ((getal > 13) || (getal == 0))
	{
		return BepaalWaardeKaart();
	}
	else
	{
		return getal;	
	}	
}

function SpelerStopt()
{
	alert("You decided to stop with a total ammount of "+SpelerTotaal);	
	SpelerGestopt = true;
	if (!PcGestopt)
		PcSpeelt();
	else
	{
		if (KijkNaarWinnaars())
		{
			return EindeSpel();
		}	
	}
}

function SpelerSpeelt()
{
	if (KijkNaarWinnaars())
	{
		return EindeSpel();
	}

	var kaart = BepaalWaardeKaart();

	switch(kaart)
	{
		case 1: alert("You got an aas"); break;
		case 11: alert("You got an jack"); break;
		case 12: alert("You got an queen"); break;
		case 13: alert("U got a king"); break;
		default: alert("You got a "+kaart);
	}

	SpelerTotaal += kaart;
	
	if (21 < SpelerTotaal)
	{
		alert("Your total ammount is now "+SpelerTotaal+". That's more than 21, so you lose.");
		alert("Your DSi won");
		EindeSpel();
	}
	else
	{
		alert("Your total ammount is now "+SpelerTotaal);
		if (!PcGestopt)
			PcSpeelt();
	}
}

function PcSpeelt()
{
	if (BerekenVolgendeZet())
	{
		var kaart = BepaalWaardeKaart();
		PcTotaal += kaart;
	
		if (21 < PcTotaal)
		{
			alert("Your DSi got more than 21, you win! Congratulations!");
			return EindeSpel();
		}
		else
		{
			alert("Your DSi got a card.");
			
			if (SpelerGestopt)
			{
				return PcSpeelt();
			}
		}
	}	
	else
	{
		alert("Your DSi passes!");
		PcGestopt = true;
		if (SpelerGestopt)
			return KijkNaarWinnaars();
	}	
}

function BerekenVolgendeZet()
{
	if (PcTotaal+13 > 21)
	{
		var KansBerekening = (21-PcTotaal)*5;

		if (KansBerekening < Math.round(Math.random()*100))
			return false;
	}	
	return true;
}

function KijkNaarWinnaars()
{
	if((SpelerGestopt) && (PcGestopt))
	{
		if (PcTotaal > SpelerTotaal)
			alert("You lose! Your DSi had "+ PcTotaal +" points, and you had just "+SpelerTotaal);
		else if (PcTotaal < SpelerTotaal)
			alert("You won! Your DSi had just "+ PcTotaal +" points, and you had "+SpelerTotaal+"! Congratulations!");
		else
			alert("There's no winner! You and your DSi have both"+SpelerTotaal+" points. This game has ended, without a winner."); 
		return true;
	} 
	return false;
}

function EindeSpel()
{
	document.getElementById("verder").onclick = function() {};
	document.getElementById("stop").onclick = function() {};
	document.getElementById("verder").value = "Press 'start new game'";
	document.getElementById("stop").value = "Press 'start new game'";
}
</script>
